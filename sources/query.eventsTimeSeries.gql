query eventsTimeSeries ($perSecond: Boolean, $withMissingData: Boolean, $buckets: Int!, $accountID: ID!, $timeFrame: TimeFrame!, $measures: [EventsMeasure], $dimensions: [EventsDimension], $filters: [EventsFilter!], $includeEmptyDimension: Boolean, $useDefaultSizeBucket: Boolean) {
	eventsTimeSeries(accountID: $accountID, timeFrame: $timeFrame, measures: $measures, dimensions: $dimensions, filters: $filters, includeEmptyDimension: $includeEmptyDimension) {
		id
		from
		to
		granularity
		timeseries(buckets: $buckets) {
			data(perSecond: $perSecond, withMissingData: $withMissingData, useDefaultSizeBucket: $useDefaultSizeBucket)
			label
			dimensions {
				label
				value
			}
			key {
				measureFieldName
				dimensions {
					fieldName
					value
				}
			}
			sum
			units
			info
		}
	}
}
