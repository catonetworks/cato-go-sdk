query notificationIntegrationWebhookList ($accountId: ID!) {
	notification(accountId: $accountId) {
		integration {
			webhookList {
				items {
					id
					name
					enabled
					url
					requestMethod
					auth {
						authType
					}
					header {
						name
						value
					}
					body
					responseMapping {
						key
						value
					}
					relatedWebhookId
				}
				paging {
					total
				}
			}
		}
	}
}
