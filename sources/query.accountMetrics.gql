query accountMetrics ($toRate: Boolean, $types: [String!], $withMissingData2: Boolean, $perSecond3: Boolean, $siteIDs: [ID!], $userIDs: [ID!], $labels1: [TimeseriesMetricType!], $buckets1: Int, $timeFrame: TimeFrame!, $groupInterfaces: Boolean, $groupDevices: Boolean, $useDefaultSizeBucket: Boolean) {
	accountMetrics(timeFrame: $timeFrame, groupInterfaces: $groupInterfaces, groupDevices: $groupDevices) {
		id
		from
		to
		granularity
		sites(siteIDs: $siteIDs) {
			id
			interfaces {
				metrics(toRate: $toRate) {
					duration
					granularity
					bytesDownstream
					bytesUpstream
					bytesTotal
					lostDownstream
					lostDownstreamPcnt
					lostUpstream
					lostUpstreamPcnt
					packetsDownstream
					packetsUpstream
					jitterUpstream
					jitterDownstream
					packetsDiscardedDownstream
					packetsDiscardedUpstream
					rtt
					hostCount
					hostLimit
					flowCount
				}
				name
				timeseries(buckets: $buckets1, labels: $labels1) {
					data(perSecond: $perSecond3, withMissingData: $withMissingData2, useDefaultSizeBucket: $useDefaultSizeBucket)
					label
					dimensions {
						label
						value
					}
					key {
						measureFieldName
						dimensions {
							fieldName
							value
						}
					}
					sum
					units
					info
				}
				annotations(types: $types) {
					time
					label
					shortLabel
					type
				}
				periods {
					duration
					title
					type
				}
				remoteIPInfo {
					ip
					countryCode
					countryName
					city
					state
					provider
					latitude
					longitude
				}
				remoteIP
				socketInfo {
					id
					serial
					isPrimary
					platform
					version
					versionUpdateTime
				}
				ipsecInfo {
					isPrimary
					catoIP
					remoteIP
					ikeVersion
					tunnelConfig {
						tunnelId
						tunnelRemoteIdentifier
						localId
					}
				}
				interfaceInfo {
					id
					name
					upstreamBandwidth
					downstreamBandwidth
					upstreamBandwidthMbpsPrecision
					downstreamBandwidthMbpsPrecision
					destType
					wanRole
				}
			}
			metrics(toRate: $toRate) {
				duration
				granularity
				bytesDownstream
				bytesUpstream
				bytesTotal
				lostDownstream
				lostDownstreamPcnt
				lostUpstream
				lostUpstreamPcnt
				packetsDownstream
				packetsUpstream
				jitterUpstream
				jitterDownstream
				packetsDiscardedDownstream
				packetsDiscardedUpstream
				rtt
				hostCount
				hostLimit
				flowCount
			}
			name
			info {
				name
				type
				description
				countryCode
				region
				countryName
				countryStateName
				cityName
				address
				isHA
				connType
				creationTime
				interfaces {
					id
					name
					upstreamBandwidth
					downstreamBandwidth
					upstreamBandwidthMbpsPrecision
					downstreamBandwidthMbpsPrecision
					destType
					wanRole
				}
				sockets {
					id
					serial
					isPrimary
					platform
					version
					versionUpdateTime
				}
				ipsec {
					isPrimary
					catoIP
					remoteIP
					ikeVersion
					tunnelConfig {
						tunnelId
						tunnelRemoteIdentifier
						localId
					}
				}
			}
			hostCount {
				data(perSecond: $perSecond3, withMissingData: $withMissingData2, useDefaultSizeBucket: $useDefaultSizeBucket)
				label
				dimensions {
					label
					value
				}
				key {
					measureFieldName
					dimensions {
						fieldName
						value
					}
				}
				sum
				units
				info
			}
			flowCount {
				data(perSecond: $perSecond3, withMissingData: $withMissingData2, useDefaultSizeBucket: $useDefaultSizeBucket)
