mutation policyWanFirewallAddSection ($policyAddSectionInput: PolicyAddSectionInput!, $accountId: ID!, $wanFirewallPolicyMutationInput: WanFirewallPolicyMutationInput) {
	policy(accountId: $accountId) {
		wanFirewall(input: $wanFirewallPolicyMutationInput) {
			addSection(input: $policyAddSectionInput) {
				section {
					audit {
						updatedTime
						updatedBy
					}
					metadata {
						lock {
							lockingAdminEmail
							lockingTime
							lockingRevisionId
						}
					}
					section {
						id
						name
					}
					properties
				}
				status
				errors {
					errorMessage
					errorCode
				}
				revision {
					id
					name
					description
					changes
					createdTime
					updatedTime
				}
			}
		}
	}
}
