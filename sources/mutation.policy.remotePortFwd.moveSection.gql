mutation policyRemotePortFwdMoveSection ($policyMoveSectionInput: PolicyMoveSectionInput!, $accountId: ID!, $remotePortFwdPolicyMutationInput: RemotePortFwdPolicyMutationInput) {
	policy(accountId: $accountId) {
		remotePortFwd(input: $remotePortFwdPolicyMutationInput) {
			moveSection(input: $policyMoveSectionInput) {
				section {
					audit {
						updatedTime
						updatedBy
					}
					metadata {
						lock {
							lockingAdminEmail
							lockingTime
							lockingRevisionId
						}
					}
					section {
						id
						name
					}
					properties
				}
				status
				errors {
					errorMessage
					errorCode
				}
				revision {
					id
					name
					description
					changes
					createdTime
					updatedTime
				}
			}
		}
	}
}
