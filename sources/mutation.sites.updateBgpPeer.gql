mutation sitesUpdateBgpPeer ($updateBgpPeerInput: UpdateBgpPeerInput!, $accountId: ID!) {
	sites(accountId: $accountId) {
		updateBgpPeer(input: $updateBgpPeerInput) {
			bgpPeer {
				siteRefSite: site {
					id
					name
				}
				id
				name
				peerAsn
				catoAsn
				peerIp
				catoIp
				advertiseDefaultRoute
				defaultRouteCommunities {
					from
					to
				}
				advertiseAllRoutes
				advertiseSummaryRoutes
				bgpSummaryRouteSummaryRoute: summaryRoute {
					id
					route
					bgpCommunityCommunity: community {
						from
						to
					}
				}
				bgpDefaultActionDefaultAction: defaultAction
				defaultActionExclusion {
					bgpRouteExactFilterRule {
						id
						globalIpRange {
							id
							name
						}
						networkSubnet
					}
					bgpRouteExactAndInclusiveFilterRule {
						id
						globalIpRange {
							id
							name
						}
						globalIpRangeException {
							id
							name
						}
						networkSubnet
						networkSubnetException
						le
						ge
					}
					communityFilterRule {
						id
						predicate
						community {
							from
							to
						}
					}
				}
				performNat
				md5AuthKey
				metric
				holdTime
				keepaliveInterval
				bfdEnabled
				bfdSettingsBfdSettings: bfdSettings {
					transmitInterval
					receiveInterval
					multiplier
				}
				bgpTrackingTracking: tracking {
					id
					enabled
					alertFrequency
					subscriptionId
				}
			}
		}
	}
}
