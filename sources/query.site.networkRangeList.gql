query networkRangeList ($accountID: ID!, $input: NetworkRangeListInput!) {
	site(accountId: $accountID) {
		networkRangeList(input: $input) {
			items {
				networkRangeId
				name
				rangeType
				subnet
				translatedSubnet
				localIp
				gateway
				vlan
				azureFloatingIp
				gcpLoadBalancerIp
				primaryManagementIp
				secondaryManagementIp
				dhcpSettings {
					dhcpType
					ipRange
					relayGroupId
					dhcpMicrosegmentation
				}
				mdnsReflector
				internetOnly
			}
			total
		}
	}
}
