mutation policyWanFirewallAddSubPolicy ($wanFirewallAddSubPolicyInput: WanFirewallAddSubPolicyInput!, $accountId: ID!, $wanFirewallPolicyMutationInput: WanFirewallPolicyMutationInput) {
	policy(accountId: $accountId) {
		wanFirewall(input: $wanFirewallPolicyMutationInput) {
			addSubPolicy(input: $wanFirewallAddSubPolicyInput) {
				policy {
					id
					name
					description
					enabled
				}
				status
				errors {
					errorMessage
					errorCode
				}
			}
		}
	}
}
