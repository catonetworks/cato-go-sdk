mutation policySdpStaticIpAllocationMoveSection ($accountId: ID!, $policyMoveSectionInput: PolicyMoveSectionInput!, $sdpStaticIpAllocationPolicyMutationInput: SdpStaticIpAllocationPolicyMutationInput) {
	policy(accountId: $accountId) {
		sdpStaticIpAllocation(input: $sdpStaticIpAllocationPolicyMutationInput) {
			moveSection(input: $policyMoveSectionInput) {
				section {
					audit {
						updatedTime
						updatedBy
					}
					metadata {
						lock {
							lockingAdminEmail
							lockingTime
							lockingRevisionId
						}
					}
					section {
						id
						name
					}
					properties
				}
				status
				errors {
					errorMessage
					errorCode
				}
				revision {
					id
					name
					description
					changes
					createdTime
					updatedTime
				}
			}
		}
	}
}
