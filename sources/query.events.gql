query events ($limit: Int, $from: Int, $accountID: ID!, $timeFrame: TimeFrame!, $measures: [EventsMeasure], $dimensions: [EventsDimension], $filters: [EventsFilter!], $sort: [EventsSort!], $eventsPostAggFilter: [EventsPostAggFilter!], $includeEmptyDimension: Boolean) {
	events(accountID: $accountID, timeFrame: $timeFrame, measures: $measures, dimensions: $dimensions, filters: $filters, postAggFilters: $eventsPostAggFilter, sort: $sort, includeEmptyDimension: $includeEmptyDimension) {
		id
		from
		to
		total
		totals
		records(limit: $limit, from: $from) {
			fieldsUnitTypes
			fieldsMap
			trends
			prevTimeFrame
			flatFields
		}
	}
}
