mutation policySocketLanAddSubPolicy ($input: SocketLanAddSubPolicyInput!, $accountID: ID!, $socketLanPolicyMutationInput: SocketLanPolicyMutationInput) {
	policy(accountId: $accountID) {
		socketLan(input: $socketLanPolicyMutationInput) {
			addSubPolicy(input: $input) {
				policy {
					id
					name
					description
					enabled
				}
				status
				errors {
					errorMessage
					errorCode
				}
			}
		}
	}
}
