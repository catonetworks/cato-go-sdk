mutation groupsDeleteGroup ($groupRefInput: GroupRefInput!, $accountId: ID!, $groupMembersListInput: GroupMembersListInput!) {
	groups(accountId: $accountId) {
		deleteGroup(input: $groupRefInput) {
			group {
				id
				name
				description
				audit {
					updatedTime
					updatedBy {
						id
						name
					}
				}
				members(input: $groupMembersListInput) {
					items {
						id
						name
						type
					}
					paging {
						total
					}
				}
				membersCount
				membersCountPerType {
					typeGroupMemberTypeCount: type
					membersCount
				}
			}
		}
	}
}
