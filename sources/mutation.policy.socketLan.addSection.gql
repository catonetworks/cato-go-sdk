mutation policySocketLanAddSection ($policyAddSectionInput: PolicyAddSectionInput!, $accountId: ID!, $socketLanPolicyMutationInput: SocketLanPolicyMutationInput) {
	policy(accountId: $accountId) {
		socketLan(input: $socketLanPolicyMutationInput) {
			addSection(input: $policyAddSectionInput) {
				section {
					audit {
						updatedTime
						updatedBy
					}
					metadata {
						lock {
							lockingAdminEmail
							lockingTime
							lockingRevisionId
						}
					}
					section {
						id
						name
					}
					properties
				}
				status
				errors {
					errorMessage
					errorCode
				}
				revision {
					id
					name
					description
					changes
					createdTime
					updatedTime
				}
			}
		}
	}
}
