mutation policyAppTenantRestrictionAddSection(
  $policyAddSectionInput: PolicyAddSectionInput!
  $accountId: ID!
) {
  policy(accountId: $accountId) {
    appTenantRestriction {
      addSection(input: $policyAddSectionInput) {
        section {
          audit {
            updatedTime
            updatedBy
          }
          section {
            id
            name
          }
          properties
        }
        status
        errors {
          errorMessage
          errorCode
        }
      }
    }
  }
}
