			}
			siteDownstreamThroughputMax {
				data(perSecond: $perSecond3, withMissingData: $withMissingData2, useDefaultSizeBucket: $useDefaultSizeBucket)
				label
				dimensions {
					label
					value
				}
				key {
					measureFieldName
					dimensions {
						fieldName
						value
					}
				}
				sum
				units
				info
			}
			samples
		}
