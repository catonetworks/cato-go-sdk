mutation policySdpStaticIpAllocationAddRule ($accountId: ID!, $sdpStaticIpAllocationAddRuleInput: SdpStaticIpAllocationAddRuleInput!, $sdpStaticIpAllocationPolicyMutationInput: SdpStaticIpAllocationPolicyMutationInput) {
	policy(accountId: $accountId) {
		sdpStaticIpAllocation(input: $sdpStaticIpAllocationPolicyMutationInput) {
			addRule(input: $sdpStaticIpAllocationAddRuleInput) {
				rule {
					audit {
						updatedTime
						updatedBy
					}
					metadata {
						lock {
							lockingAdminEmail
							lockingTime
							lockingRevisionId
						}
					}
					rule {
						id
						name
						description
						index
						section {
							id
							name
						}
						enabled
						source {
							user {
								id
								name
							}
						}
						ip
					}
					properties
				}
				revision {
					id
					name
					description
					changes
					createdTime
					updatedTime
				}
				status
				errors {
					errorMessage
					errorCode
				}
			}
		}
	}
}
